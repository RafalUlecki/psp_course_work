<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
    <title>PropHover generic tabs</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 1rem;
      }
      [role="tablist"] {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      [role="tab"] {
        border: 1px solid #ccc;
        padding: 0.4rem 0.8rem;
        background: #f5f5f5;
        cursor: pointer;
      }
      [role="tab"][aria-selected="true"] {
        background: #fff;
        font-weight: bold;
      }
      .selection-row {
        border: 1px solid #ccc;
        padding: 0.5rem;
        margin: 0.5rem 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="betslip">Kortelė(0)</div>
    <div id="layout-probe">layout-probe</div>

    <div role="tablist">
      <button
        type="button"
        role="tab"
        id="points-tab"
        aria-selected="true"
        aria-controls="market-panel"
      >
        Žaidėjo pelnyti taškai
      </button>
      <button
        type="button"
        role="tab"
        id="rebounds-tab"
        aria-selected="false"
        aria-controls="market-panel"
      >
        Žaidėjo atkovoti kamuoliai
      </button>
      <button
        type="button"
        role="tab"
        id="combo-tab"
        aria-selected="false"
        aria-controls="market-panel"
      >
        Žaidėjo taškai + atkovoti kamuoliai
      </button>
    </div>

    <div id="market-panel" role="tabpanel" aria-labelledby="points-tab">
      <div id="doncic-row" class="selection-row">
        <span id="doncic-name"></span>
        <div id="doncic-over"></div>
        <div id="doncic-over-odds"></div>
        <div id="doncic-under"></div>
        <div id="doncic-under-odds"></div>
      </div>
      <div id="jokic-row" class="selection-row">
        <span id="jokic-name"></span>
        <div id="jokic-over"></div>
        <div id="jokic-over-odds"></div>
        <div id="jokic-under"></div>
        <div id="jokic-under-odds"></div>
      </div>
    </div>

    <script>
      const MARKETS = {
        points: {
          tabId: "points-tab",
          doncic: {
            name: "Luka Doncic ",
            over: "Daugiau 30.5",
            overOdds: "1.80",
            under: "Mažiau 30.5",
            underOdds: "1.90",
          },
          jokic: {
            name: "Nikola Jokic ",
            over: "Daugiau 24.5",
            overOdds: "1.80",
            under: "Mažiau 24.5",
            underOdds: "1.90",
          },
        },
        rebounds: {
          tabId: "rebounds-tab",
          doncic: {
            name: "Luka Doncic ",
            over: "Daugiau 8.5",
            overOdds: "1.80",
            under: "Mažiau 8.5",
            underOdds: "1.90",
          },
          jokic: {
            name: "Nikola Jokic ",
            over: "Daugiau 10.5",
            overOdds: "1.80",
            under: "Mažiau 10.5",
            underOdds: "1.90",
          },
        },
        combo: {
          tabId: "combo-tab",
          doncic: {
            name: "Luka Doncic ",
            over: "Daugiau 40.5",
            overOdds: "1.80",
            under: "Mažiau 40.5",
            underOdds: "1.90",
          },
          jokic: {
            name: "Nikola Jokic ",
            over: "Daugiau 32.5",
            overOdds: "1.80",
            under: "Mažiau 32.5",
            underOdds: "1.90",
          },
        },
      };

      const fillRow = (prefix, data) => {
        document.getElementById(prefix + "-name").textContent = data.name;
        document.getElementById(prefix + "-over").textContent = data.over;
        document.getElementById(prefix + "-over-odds").textContent =
          data.overOdds;
        document.getElementById(prefix + "-under").textContent = data.under;
        document.getElementById(prefix + "-under-odds").textContent =
          data.underOdds;
      };

      const setSelectedTab = (tabId) => {
        document.querySelectorAll('[role="tab"]').forEach((tab) => {
          tab.setAttribute(
            "aria-selected",
            tab.id === tabId ? "true" : "false",
          );
        });
        document
          .getElementById("market-panel")
          .setAttribute("aria-labelledby", tabId);
      };

      const renderMarket = (marketName) => {
        const market = MARKETS[marketName];
        setSelectedTab(market.tabId);
        fillRow("doncic", market.doncic);
        fillRow("jokic", market.jokic);
      };

      window.addEventListener("load", () => {
        window.setTimeout(() => {
          renderMarket("points");
        }, 150);
      });

      document.getElementById("points-tab").addEventListener("click", () => {
        renderMarket("points");
      });
      document.getElementById("rebounds-tab").addEventListener("click", () => {
        renderMarket("rebounds");
      });
      document.getElementById("combo-tab").addEventListener("click", () => {
        renderMarket("combo");
      });

      let count = 0;
      const betslip = document.getElementById("betslip");
      document.querySelectorAll(".selection-row").forEach((row) => {
        row.addEventListener("click", () => {
          count += 1;
          betslip.textContent = "Kortelė(" + count + ")";
        });
      });
    </script>
  </body>
</html>
