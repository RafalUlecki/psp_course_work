name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://prophover:prophover@localhost:5432/prophover
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prophover
          POSTGRES_PASSWORD: prophover
          POSTGRES_DB: prophover
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/extension/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: apps/extension
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Build extension
        working-directory: apps/extension
        env:
          VITE_HIT_RATE_API_BASE: http://localhost:3000
        run: npm run build
